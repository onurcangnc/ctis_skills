name: acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Without Pillow the asset validator cannot read the logo's dimensions and
      # reports that as a failure rather than passing on a check it did not run.
      - name: Install the development requirements
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # The example suite reports a named skip for any runtime that is absent,
      # and never counts a skip as a pass. PHP and the JDK are installed here so
      # the hosted run covers more of the suite than a typical laptop does.
      - name: Report the runtimes this job provides
        run: |
          for tool in python3 gcc g++ php node javac; do
            printf '%-8s %s\n' "$tool" "$(command -v "$tool" || echo 'absent')"
          done

      - name: Tracked tree audit
        run: python -B tools/audit_public_tree.py --tracked

      # Ordered before the unit suite because it names the gate and the check
      # that failed, where the suite only reports that the wrapper assertion
      # went red.
      - name: Acceptance gates
        run: python -B tools/run_acceptance.py

      # tmp/public-acceptance.json is ignored and never leaves the runner, but a
      # red run is unreadable without the check that failed inside it.
      - name: Failing checks from the acceptance report
        if: failure()
        run: |
          python -B - <<'PY'
          import json, pathlib
          report = pathlib.Path("tmp/public-acceptance.json")
          if not report.is_file():
              raise SystemExit("no acceptance report was written")
          for name, gate in json.loads(report.read_text(encoding="utf-8"))["gates"].items():
              for check in gate["checks"]:
                  if check["status"] != "pass":
                      print(f"{name}/{check['name']}: {check['message']}")
          PY

      - name: Unit suite
        run: python -B -m unittest discover -s tests -v

      - name: Whitespace check
        run: git diff --check

      # tmp/public-acceptance.json is ignored and must stay that way. A run that
      # leaves anything behind in the checkout it validated is a failure, and the
      # report records that separately as source_checkout_non_mutation.
      - name: Checkout is unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the acceptance run modified the checkout:"
            git status --porcelain
            exit 1
          fi
